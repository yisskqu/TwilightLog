openapi: 3.1.0
info:
  title: TwilightLog API
  version: 0.1.0
  description: TwilightLog 公开站与管理后台共用的 API 契约。
servers:
  - url: http://localhost:8080
    description: 本地 Caddy 入口
tags:
  - name: system
  - name: capabilities
  - name: auth
  - name: account
  - name: audit
  - name: media
  - name: content
  - name: workspace
  - name: review
  - name: recommendation
  - name: notification
  - name: tag
paths:
  /healthz:
    get:
      tags: [system]
      summary: 进程存活检查
      operationId: getHealthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      summary: 依赖就绪检查
      operationId: getReadyz
      responses:
        "200":
          description: 数据库可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/capabilities:
    get:
      tags: [capabilities]
      summary: 获取启用模块、菜单与权限
      operationId: getCapabilities
      responses:
        "200":
          description: 当前启用的能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，同时写入 refresh Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 登录尝试次数过多
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 刷新成功，refresh token 已轮换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 获取当前登录用户
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户及权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/editor/ping:
    get:
      tags: [auth]
      summary: 编辑工作区权限探针
      operationId: getEditorPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 编辑或管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/ping:
    get:
      tags: [auth]
      summary: 管理后台权限探针
      operationId: getAdminPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users:
    get:
      tags: [account]
      summary: 账号列表
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: 按用户名或邮箱搜索
          schema:
            type: string
      responses:
        "200":
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [account]
      summary: 创建普通账号
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: 账号已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 用户名或邮箱已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/role:
    patch:
      tags: [account]
      summary: 授予或撤销编辑权限
      operationId: setAccountRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: 角色已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/reset-password:
    post:
      tags: [account]
      summary: 重置密码
      operationId: resetAccountPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 密码已重置，旧会话全部失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/status:
    patch:
      tags: [account]
      summary: 禁用或启用账号
      operationId: setAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/audit:
    get:
      tags: [audit]
      summary: 审计日志列表
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/presign:
    post:
      tags: [media]
      summary: 申请媒体上传地址
      operationId: presignMedia
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 同一批次重复申请时返回同一媒体记录
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPresignRequest"
      responses:
        "201":
          description: 上传地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPresignResponse"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: 不支持的格式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 批次数量超过 20 张
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/complete:
    post:
      tags: [media]
      summary: 完成上传并开始处理（幂等）
      operationId: completeMedia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCompleteRequest"
      responses:
        "200":
          description: 已处理完成或此前已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "202":
          description: 已进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 上传未完成或状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}:
    get:
      tags: [media]
      summary: 查询媒体处理状态
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 媒体详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/retry:
    post:
      tags: [media]
      summary: 重试失败的处理
      operationId: retryMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: 已重新进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "409":
          description: 当前状态不可重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/original:
    get:
      tags: [media]
      summary: 获取原图短时签名地址
      operationId: getMediaOriginal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 签名地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURL"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}:
    put:
      tags: [media]
      summary: 直传单个文件（能力地址，无需登录）
      operationId: uploadMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}/parts/{part}:
    put:
      tags: [media]
      summary: 直传一个分片（能力地址，无需登录）
      operationId: uploadMediaPart
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 分片上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/signed:
    get:
      tags: [media]
      summary: 读取私有原图（签名地址）
      operationId: getSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 原图二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/upload:
    put:
      tags: [media]
      summary: 通用预签名上传（能力地址）
      operationId: putSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /assets/{key}:
    get:
      tags: [media]
      summary: 读取公开衍生图
      operationId: getPublicAsset
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WebP 衍生图
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
  /api/v1/home/recommendations:
    get:
      tags: [content]
      summary: 首页推荐内容
      operationId: getRecommendations
      parameters:
        - name: limit
          in: query
          description: 返回数量，默认 6
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 已发布且可见的推荐文章与相册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRecommendations"
        "304":
          description: 内容未修改
  /api/v1/article-columns:
    get:
      tags: [content]
      summary: 文章专栏列表
      operationId: listArticleColumns
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 文章专栏分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleColumnPage"
        "304":
          description: 内容未修改
  /api/v1/article-columns/{slug}/articles:
    get:
      tags: [content]
      summary: 专栏内文章列表
      operationId: listColumnArticles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 文章分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnArticles"
        "304":
          description: 内容未修改
        "404":
          description: 专栏不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/articles/{slug}:
    get:
      tags: [content]
      summary: 文章详情
      operationId: getArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已发布文章详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "304":
          description: 内容未修改
        "404":
          description: 文章不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/photo-columns:
    get:
      tags: [content]
      summary: 摄影专栏列表
      operationId: listPhotoColumns
      parameters:
        - name: theme
          in: query
          description: 摄影题材
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 摄影专栏分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoColumnPage"
        "304":
          description: 内容未修改
  /api/v1/photo-columns/{slug}/albums:
    get:
      tags: [content]
      summary: 专栏内相册列表
      operationId: listColumnAlbums
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 相册分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnAlbums"
        "304":
          description: 内容未修改
        "404":
          description: 专栏不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/albums/{slug}:
    get:
      tags: [content]
      summary: 相册详情
      operationId: getAlbum
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已发布相册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "304":
          description: 内容未修改
        "404":
          description: 相册不存在、未公开或没有公开照片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/albums/{slug}/photos:
    get:
      tags: [content]
      summary: 相册内照片列表
      operationId: listAlbumPhotos
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 照片分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "304":
          description: 内容未修改
  /api/v1/photos:
    get:
      tags: [content]
      summary: 照片列表
      operationId: listPhotos
      parameters:
        - name: album
          in: query
          description: 相册 slug
          schema:
            type: string
        - name: column
          in: query
          description: 摄影专栏 slug
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
