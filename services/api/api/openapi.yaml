      operationId: listAdminTags
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [article, photo]
      responses:
        "200":
          description: 标签与使用数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsageList"
  /api/v1/admin/tags/{id}:
    patch:
      tags: [tag]
      summary: 重命名或停用标签
      operationId: updateTag
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
