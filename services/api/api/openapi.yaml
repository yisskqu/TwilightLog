openapi: 3.1.0
info:
  title: TwilightLog API
  version: 0.1.0
  description: TwilightLog 公开站与管理后台共用的 API 契约。
servers:
  - url: http://localhost:8080
    description: 本地 Caddy 入口
tags:
  - name: system
  - name: capabilities
  - name: auth
  - name: account
  - name: audit
  - name: media
  - name: content
paths:
  /healthz:
    get:
      tags: [system]
      summary: 进程存活检查
      operationId: getHealthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      summary: 依赖就绪检查
      operationId: getReadyz
      responses:
        "200":
          description: 数据库可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/capabilities:
    get:
      tags: [capabilities]
      summary: 获取启用模块、菜单与权限
      operationId: getCapabilities
      responses:
        "200":
          description: 当前启用的能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，同时写入 refresh Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 登录尝试次数过多
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 刷新成功，refresh token 已轮换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 获取当前登录用户
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户及权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/editor/ping:
    get:
      tags: [auth]
      summary: 编辑工作区权限探针
      operationId: getEditorPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 编辑或管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/ping:
    get:
      tags: [auth]
      summary: 管理后台权限探针
      operationId: getAdminPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users:
    get:
      tags: [account]
      summary: 账号列表
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: 按用户名或邮箱搜索
          schema:
            type: string
      responses:
        "200":
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [account]
      summary: 创建普通账号
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: 账号已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 用户名或邮箱已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/role:
    patch:
      tags: [account]
      summary: 授予或撤销编辑权限
      operationId: setAccountRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: 角色已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/reset-password:
    post:
      tags: [account]
      summary: 重置密码
      operationId: resetAccountPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 密码已重置，旧会话全部失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/status:
    patch:
      tags: [account]
      summary: 禁用或启用账号
      operationId: setAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/audit:
    get:
      tags: [audit]
      summary: 审计日志列表
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/presign:
    post:
      tags: [media]
      summary: 申请媒体上传地址
      operationId: presignMedia
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 同一批次重复申请时返回同一媒体记录
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPresignRequest"
      responses:
        "201":
          description: 上传地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPresignResponse"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: 不支持的格式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 批次数量超过 20 张
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/complete:
    post:
      tags: [media]
      summary: 完成上传并开始处理（幂等）
      operationId: completeMedia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCompleteRequest"
      responses:
        "200":
          description: 已处理完成或此前已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "202":
          description: 已进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 上传未完成或状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}:
    get:
      tags: [media]
      summary: 查询媒体处理状态
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 媒体详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/retry:
    post:
      tags: [media]
      summary: 重试失败的处理
      operationId: retryMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: 已重新进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "409":
          description: 当前状态不可重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/original:
    get:
      tags: [media]
      summary: 获取原图短时签名地址
      operationId: getMediaOriginal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 签名地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURL"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}:
    put:
      tags: [media]
      summary: 直传单个文件（能力地址，无需登录）
      operationId: uploadMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}/parts/{part}:
    put:
      tags: [media]
      summary: 直传一个分片（能力地址，无需登录）
      operationId: uploadMediaPart
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 分片上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/signed:
    get:
      tags: [media]
      summary: 读取私有原图（签名地址）
      operationId: getSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 原图二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/upload:
    put:
      tags: [media]
      summary: 通用预签名上传（能力地址）
      operationId: putSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /assets/{key}:
    get:
      tags: [media]
      summary: 读取公开衍生图
      operationId: getPublicAsset
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WebP 衍生图
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
  /api/v1/home/recommendations:
    get:
      tags: [content]
      summary: 首页推荐内容
      operationId: getRecommendations
      parameters:
        - name: limit
          in: query
          description: 返回数量，默认 6
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 已发布且可见的推荐文章与相册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRecommendations"
        "304":
          description: 内容未修改
  /api/v1/article-columns:
    get:
      tags: [content]
      summary: 文章专栏列表
      operationId: listArticleColumns
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 文章专栏分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleColumnPage"
        "304":
          description: 内容未修改
  /api/v1/article-columns/{slug}/articles:
    get:
      tags: [content]
      summary: 专栏内文章列表
      operationId: listColumnArticles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 文章分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnArticles"
        "304":
          description: 内容未修改
        "404":
          description: 专栏不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/articles/{slug}:
    get:
      tags: [content]
      summary: 文章详情
      operationId: getArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已发布文章详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "304":
          description: 内容未修改
        "404":
          description: 文章不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/photo-columns:
    get:
      tags: [content]
      summary: 摄影专栏列表
      operationId: listPhotoColumns
      parameters:
        - name: theme
          in: query
          description: 摄影题材
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 摄影专栏分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoColumnPage"
        "304":
          description: 内容未修改
  /api/v1/photo-columns/{slug}/albums:
    get:
      tags: [content]
      summary: 专栏内相册列表
      operationId: listColumnAlbums
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 相册分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnAlbums"
        "304":
          description: 内容未修改
        "404":
          description: 专栏不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/albums/{slug}:
    get:
      tags: [content]
      summary: 相册详情
      operationId: getAlbum
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已发布相册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "304":
          description: 内容未修改
        "404":
          description: 相册不存在、未公开或没有公开照片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/albums/{slug}/photos:
    get:
      tags: [content]
      summary: 相册内照片列表
      operationId: listAlbumPhotos
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 照片分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "304":
          description: 内容未修改
  /api/v1/photos:
    get:
      tags: [content]
      summary: 照片列表
      operationId: listPhotos
      parameters:
        - name: album
          in: query
          description: 相册 slug
          schema:
            type: string
        - name: column
          in: query
          description: 摄影专栏 slug
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 照片分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "304":
          description: 内容未修改
  /api/v1/photos/{id}:
    get:
      tags: [content]
      summary: 照片详情
      operationId: getPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已发布照片与元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoDetail"
        "304":
          description: 内容未修改
        "404":
          description: 照片不存在或未公开
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/search:
    get:
      tags: [content]
      summary: 全站搜索
      operationId: searchContent
      parameters:
        - name: q
          in: query
          required: true
          description: 关键词，匹配标题、摘要、正文索引与标签
          schema:
            type: string
        - name: type
          in: query
          description: 逗号分隔的内容类型，例如 article,album；留空表示全部
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "304":
          description: 内容未修改
        "400":
          description: 关键词为空或参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tags:
    get:
      tags: [content]
      summary: 公开标签词库
      operationId: listTags
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [article, photo]
            default: article
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "304":
          description: 内容未修改
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: twilightlog_refresh
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: 账号 ID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页数量，默认 12
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    MediaId:
      name: id
      in: path
      required: true
      description: 媒体 ID
      schema:
        type: string
        format: uuid
    Search:
      name: q
      in: query
      description: 关键词，匹配标题、摘要、正文索引与标签
      schema:
        type: string
    Tags:
      name: tags
      in: query
      description: 逗号分隔的标签名，内容必须同时含有全部标签
      schema:
        type: string
    DateFrom:
      name: dateFrom
      in: query
      description: 起始日期（含当天），格式 YYYY-MM-DD
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: 结束日期（含当天），格式 YYYY-MM-DD
      schema:
        type: string
        format: date
    Sort:
      name: sort
      in: query
      description: 时间排序
      schema:
        type: string
        enum: [latest, oldest]
        default: latest
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: 可选的结构化错误详情
        requestId:
          type: string
    Capabilities:
      type: object
      required: [modules, menus, permissions]
      properties:
        modules:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    OkResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    User:
      type: object
      required: [id, username, email, role, status, createdAt, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
    SessionResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: access token 剩余秒数
        user:
          $ref: "#/components/schemas/User"
    Account:
      type: object
      required: [id, username, email, role, status, canManage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        canManage:
          type: boolean
          description: 管理员账号为 false，后台不可操作
        createdAt:
          type: string
          format: date-time
    AccountPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateAccountRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          description: 3-32 位小写字母、数字、点、横线或下划线
        email:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [user, editor]
          default: user
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [user, editor]
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    AuditEntry:
      type: object
      required: [id, actorId, actorName, action, targetType, targetId, result, ip, userAgent, metadata, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: string
          nullable: true
        actorName:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
          enum: [success, failure]
        ip:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    MediaPresignRequest:
      type: object
      required: [purpose, filename, contentType, size, batchId]
      properties:
        purpose:
          type: string
          enum: [article, photo]
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size:
          type: integer
          format: int64
          description: 文件字节数
        batchId:
          type: string
          maxLength: 100
          description: 单次选择的批次标识，同一批次最多 20 张
    MediaPresignResponse:
      type: object
      required: [mediaId, status, uploadMode, headers, expiresIn]
      properties:
        mediaId:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        uploadMode:
          type: string
          enum: [single, multipart]
        uploadUrl:
          type: string
          description: uploadMode=single 时的直传地址
        partUrls:
          type: array
          description: uploadMode=multipart 时的分片地址
          items:
            type: string
        partSize:
          type: integer
          format: int64
        partCount:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
        expiresIn:
          type: integer
          description: 上传地址有效期（秒）
    MediaCompleteRequest:
      type: object
      required: [mediaId]
      properties:
        mediaId:
          type: string
          format: uuid
    MediaVariant:
      type: object
      required: [name, url, width, height, size]
      properties:
        name:
          type: string
          enum: [w480, w960, w1440, w2048, w2560]
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
          format: int64
    MediaExif:
      type: object
      description: 仅保留白名单字段，绝不包含 GPS
      properties:
        cameraMake:
          type: string
        cameraModel:
          type: string
        lensModel:
          type: string
        focalLength:
          type: string
        aperture:
          type: string
        shutterSpeed:
          type: string
        iso:
          type: integer
        takenAt:
          type: string
        timeZone:
          type: string
        exposureBias:
          type: string
        whiteBalance:
          type: string
        orientation:
          type: integer
        sourceWidth:
          type: integer
        sourceHeight:
          type: integer
    MediaAsset:
      type: object
      required: [id, purpose, status, originalFilename, mimeType, fileSize, width, height, blurhash, exif, variants, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [article, photo]
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        blurhash:
          type: string
        exif:
          $ref: "#/components/schemas/MediaExif"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/MediaVariant"
        originalUrl:
          type: string
          description: 短时签名原图地址，仅 ready 状态返回
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        processedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SignedURL:
      type: object
      required: [url, expiresIn]
      properties:
        url:
          type: string
        expiresIn:
          type: string
    AssetVariant:
      type: object
      required: [name, url, width, height, size]
      properties:
        name:
          type: string
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
    Asset:
      type: object
      required: [mediaId, key, width, height, blurhash, variants]
      properties:
        mediaId:
          type: string
          format: uuid
        key:
          type: string
          description: 前端 assetUrl(key, variant) 使用的衍生图前缀
        width:
          type: integer
        height:
          type: integer
        blurhash:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/AssetVariant"
    ColumnRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    ArticleColumn:
      type: object
      required: [id, slug, name, description, cover, tags, articleCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        cover:
          $ref: "#/components/schemas/Asset"
        tags:
          type: array
          items:
            type: string
        articleCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ArticleSummary:
      type: object
      required: [id, slug, title, summary, column, cover, tags, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        column:
          $ref: "#/components/schemas/ColumnRef"
        cover:
          $ref: "#/components/schemas/Asset"
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [bodyMarkdown]
          properties:
            bodyMarkdown:
              type: string
    PhotoColumn:
      type: object
      required: [id, slug, name, description, theme, cover, tags, albumCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        theme:
          type: string
        cover:
          $ref: "#/components/schemas/Asset"
        tags:
          type: array
          items:
            type: string
        albumCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    Album:
      type: object
      required: [id, slug, title, description, location, shotAt, column, cover, tags, photoCount, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        location:
          type: string
        shotAt:
          type: string
        column:
          $ref: "#/components/schemas/ColumnRef"
        cover:
          $ref: "#/components/schemas/Asset"
        tags:
          type: array
          items:
            type: string
        photoCount:
          type: integer
        latestPhotoAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
    PhotoSummary:
      type: object
      required: [id, title, description, location, takenAt, album, column, tags, media, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        location:
          type: string
        takenAt:
          type: string
        album:
          $ref: "#/components/schemas/ColumnRef"
        column:
          $ref: "#/components/schemas/ColumnRef"
        tags:
          type: array
          items:
            type: string
        media:
          $ref: "#/components/schemas/Asset"
        publishedAt:
          type: string
          format: date-time
    PhotoDetail:
      allOf:
        - $ref: "#/components/schemas/PhotoSummary"
        - type: object
          required: [exif]
          properties:
            exif:
              $ref: "#/components/schemas/MediaExif"
    SearchHit:
      type: object
      required: [type, id, slug, title, summary, cover, publishedAt, column, album]
      properties:
        type:
          type: string
          enum: [article_column, article, photo_column, album, photo]
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        cover:
          $ref: "#/components/schemas/Asset"
        publishedAt:
          type: string
          format: date-time
        column:
          $ref: "#/components/schemas/ColumnRef"
        album:
          $ref: "#/components/schemas/ColumnRef"
    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TagList:
      type: object
      required: [scope, items]
      properties:
        scope:
          type: string
          enum: [article, photo]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    Recommendation:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [article, album]
        article:
          $ref: "#/components/schemas/ArticleSummary"
        album:
          $ref: "#/components/schemas/Album"
    HomeRecommendations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
    ArticleColumnPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleColumn"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ArticlePage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ColumnArticles:
      type: object
      required: [column, items, page, pageSize, total, totalPages]
      properties:
        column:
          $ref: "#/components/schemas/ColumnRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PhotoColumnPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoColumn"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    AlbumPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ColumnAlbums:
      type: object
      required: [column, items, page, pageSize, total, totalPages]
      properties:
        column:
          $ref: "#/components/schemas/ColumnRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PhotoPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhotoSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    SearchPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
