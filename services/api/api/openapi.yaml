      properties:
        cameraMake:
          type: string
        cameraModel:
          type: string
        lensModel:
          type: string
        focalLength:
          type: string
        aperture:
          type: string
        shutterSpeed:
          type: string
        iso:
          type: integer
        takenAt:
          type: string
        timeZone:
          type: string
        exposureBias:
          type: string
        whiteBalance:
          type: string
        orientation:
          type: integer
        sourceWidth:
          type: integer
        sourceHeight:
          type: integer
    MediaAsset:
      type: object
      required: [id, purpose, status, originalFilename, mimeType, fileSize, width, height, blurhash, exif, variants, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [article, photo]
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        blurhash:
          type: string
        exif:
          $ref: "#/components/schemas/MediaExif"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/MediaVariant"
        originalUrl:
          type: string
          description: 短时签名原图地址，仅 ready 状态返回
        error:
          type: object
          properties:
            code:
              type: string
            message:
