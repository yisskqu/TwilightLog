      operationId: purgeContent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContentType"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: 已删除并清理在线文件
          content:
            application/json:
              schema:
                type: object
                required: [status, mediaPurged]
                properties:
                  status:
                    type: string
                  mediaPurged:
                    type: integer
        "403":
          description: 仅桌面端管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: twilightlog_refresh
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: 账号 ID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页数量，默认 12
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    MediaId:
      name: id
      in: path
      required: true
      description: 媒体 ID
      schema:
        type: string
        format: uuid
    Search:
      name: q
      in: query
      description: 关键词，匹配标题、摘要、正文索引与标签
      schema:
        type: string
    Tags:
      name: tags
      in: query
      description: 逗号分隔的标签名，内容必须同时含有全部标签
      schema:
        type: string
    DateFrom:
      name: dateFrom
      in: query
      description: 起始日期（含当天），格式 YYYY-MM-DD
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: 结束日期（含当天），格式 YYYY-MM-DD
      schema:
        type: string
        format: date
    Sort:
      name: sort
      in: query
      description: 时间排序
      schema:
        type: string
        enum: [latest, oldest]
        default: latest
    ContentType:
      name: type
      in: path
      required: true
      description: 内容类型
      schema:
        $ref: "#/components/schemas/ContentType"
    ContentId:
      name: id
      in: path
      required: true
      description: 内容 ID
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: 可选的结构化错误详情
        requestId:
          type: string
    Capabilities:
      type: object
      required: [modules, menus, permissions]
      properties:
        modules:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    OkResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    User:
      type: object
      required: [id, username, email, role, status, createdAt, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
    SessionResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: access token 剩余秒数
        user:
          $ref: "#/components/schemas/User"
    Account:
      type: object
      required: [id, username, email, role, status, canManage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        canManage:
          type: boolean
          description: 管理员账号为 false，后台不可操作
        createdAt:
          type: string
          format: date-time
    AccountPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateAccountRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          description: 3-32 位小写字母、数字、点、横线或下划线
        email:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [user, editor]
          default: user
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [user, editor]
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    AuditEntry:
      type: object
      required: [id, actorId, actorName, action, targetType, targetId, result, ip, userAgent, metadata, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: string
          nullable: true
        actorName:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
          enum: [success, failure]
        ip:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          additionalProperties: true
