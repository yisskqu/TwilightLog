openapi: 3.1.0
info:
  title: TwilightLog API
  version: 0.1.0
  description: TwilightLog 公开站与管理后台共用的 API 契约。
servers:
  - url: http://localhost:8080
    description: 本地 Caddy 入口
tags:
  - name: system
  - name: capabilities
  - name: auth
  - name: account
  - name: audit
  - name: media
paths:
  /healthz:
    get:
      tags: [system]
      summary: 进程存活检查
      operationId: getHealthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      summary: 依赖就绪检查
      operationId: getReadyz
      responses:
        "200":
          description: 数据库可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/capabilities:
    get:
      tags: [capabilities]
      summary: 获取启用模块、菜单与权限
      operationId: getCapabilities
      responses:
        "200":
          description: 当前启用的能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，同时写入 refresh Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 登录尝试次数过多
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 刷新成功，refresh token 已轮换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: 会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 获取当前登录用户
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户及权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/editor/ping:
    get:
      tags: [auth]
      summary: 编辑工作区权限探针
      operationId: getEditorPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 编辑或管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/ping:
    get:
      tags: [auth]
      summary: 管理后台权限探针
      operationId: getAdminPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 管理员可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users:
    get:
      tags: [account]
      summary: 账号列表
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: 按用户名或邮箱搜索
          schema:
            type: string
      responses:
        "200":
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [account]
      summary: 创建普通账号
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: 账号已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 用户名或邮箱已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/role:
    patch:
      tags: [account]
      summary: 授予或撤销编辑权限
      operationId: setAccountRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: 角色已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/reset-password:
    post:
      tags: [account]
      summary: 重置密码
      operationId: resetAccountPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 密码已重置，旧会话全部失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/users/{id}/status:
    patch:
      tags: [account]
      summary: 禁用或启用账号
      operationId: setAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: 管理员账号受保护或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/audit:
    get:
      tags: [audit]
      summary: 审计日志列表
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/presign:
    post:
      tags: [media]
      summary: 申请媒体上传地址
      operationId: presignMedia
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 同一批次重复申请时返回同一媒体记录
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPresignRequest"
      responses:
        "201":
          description: 上传地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPresignResponse"
        "400":
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: 不支持的格式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 批次数量超过 20 张
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/complete:
    post:
      tags: [media]
      summary: 完成上传并开始处理（幂等）
      operationId: completeMedia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCompleteRequest"
      responses:
        "200":
          description: 已处理完成或此前已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "202":
          description: 已进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 上传未完成或状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}:
    get:
      tags: [media]
      summary: 查询媒体处理状态
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 媒体详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/retry:
    post:
      tags: [media]
      summary: 重试失败的处理
      operationId: retryMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: 已重新进入处理中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "409":
          description: 当前状态不可重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/{id}/original:
    get:
      tags: [media]
      summary: 获取原图短时签名地址
      operationId: getMediaOriginal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 签名地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedURL"
        "404":
          description: 媒体不存在或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}:
    put:
      tags: [media]
      summary: 直传单个文件（能力地址，无需登录）
      operationId: uploadMedia
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 文件超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/upload/{id}/parts/{part}:
    put:
      tags: [media]
      summary: 直传一个分片（能力地址，无需登录）
      operationId: uploadMediaPart
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 分片上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 当前状态不接受上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/signed:
    get:
      tags: [media]
      summary: 读取私有原图（签名地址）
      operationId: getSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 原图二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assets/upload:
    put:
      tags: [media]
      summary: 通用预签名上传（能力地址）
      operationId: putSignedAsset
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 上传成功
        "403":
          description: 签名无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /assets/{key}:
    get:
      tags: [media]
      summary: 读取公开衍生图
      operationId: getPublicAsset
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WebP 衍生图
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: twilightlog_refresh
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: 账号 ID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页数量，默认 12
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    MediaId:
      name: id
      in: path
      required: true
      description: 媒体 ID
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: 可选的结构化错误详情
        requestId:
          type: string
    Capabilities:
      type: object
      required: [modules, menus, permissions]
      properties:
        modules:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    OkResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    User:
      type: object
      required: [id, username, email, role, status, createdAt, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
    SessionResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: access token 剩余秒数
        user:
          $ref: "#/components/schemas/User"
    Account:
      type: object
      required: [id, username, email, role, status, canManage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, editor, user]
        status:
          type: string
          enum: [active, disabled]
        canManage:
          type: boolean
          description: 管理员账号为 false，后台不可操作
        createdAt:
          type: string
          format: date-time
    AccountPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateAccountRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          description: 3-32 位小写字母、数字、点、横线或下划线
        email:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [user, editor]
          default: user
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [user, editor]
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    AuditEntry:
      type: object
      required: [id, actorId, actorName, action, targetType, targetId, result, ip, userAgent, metadata, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: string
          nullable: true
        actorName:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
          enum: [success, failure]
        ip:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    MediaPresignRequest:
      type: object
      required: [purpose, filename, contentType, size, batchId]
      properties:
        purpose:
          type: string
          enum: [article, photo]
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size:
          type: integer
          format: int64
          description: 文件字节数
        batchId:
          type: string
          maxLength: 100
          description: 单次选择的批次标识，同一批次最多 20 张
    MediaPresignResponse:
      type: object
      required: [mediaId, status, uploadMode, headers, expiresIn]
      properties:
        mediaId:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        uploadMode:
          type: string
          enum: [single, multipart]
        uploadUrl:
          type: string
          description: uploadMode=single 时的直传地址
        partUrls:
          type: array
          description: uploadMode=multipart 时的分片地址
          items:
            type: string
        partSize:
          type: integer
          format: int64
        partCount:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
        expiresIn:
          type: integer
          description: 上传地址有效期（秒）
    MediaCompleteRequest:
      type: object
      required: [mediaId]
      properties:
        mediaId:
          type: string
          format: uuid
    MediaVariant:
      type: object
      required: [name, url, width, height, size]
      properties:
        name:
          type: string
          enum: [w480, w960, w1440, w2048, w2560]
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
          format: int64
    MediaExif:
      type: object
