services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: twilightlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twilightlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twilightlog_dev}
      POSTGRES_DB: ${POSTGRES_DB:-twilightlog}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - twilightlog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-twilightlog} -d ${POSTGRES_DB:-twilightlog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    container_name: twilightlog-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-twilightlog}:${POSTGRES_PASSWORD:-twilightlog_dev}@postgres:5432/${POSTGRES_DB:-twilightlog}?sslmode=disable"
      RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      REFRESH_TOKEN_TTL_SHORT: ${REFRESH_TOKEN_TTL_SHORT:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321,http://localhost:5173}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4321}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5173}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: twilightlog-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/site:/srv:ro
      - twilightlog_caddy_data:/data
      - twilightlog_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  twilightlog_pgdata:
  twilightlog_caddy_data:
  twilightlog_caddy_config:
